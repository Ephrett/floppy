name: build
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
  macos:
    needs: tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install -r requirements.txt
      - run: ./build-mac.sh
      - run: python3 scripts/smoke-frozen.py dist/FLOPPY.app/Contents/MacOS/FLOPPY
      - run: ./build-dmg.sh
      - run: hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with: { name: FLOPPY-macOS-unsigned, path: dist/*.dmg }
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - run: powershell -File build-win.ps1
      - run: python scripts/smoke-frozen.py dist/FLOPPY/FLOPPY.exe
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q floppy.iss'
      - name: Verify installed Windows app
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'floppy-installed'
          $setup = (Get-ChildItem dist/FLOPPY-Setup-*.exe).FullName
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          python scripts/smoke-frozen.py "$installDir/FLOPPY.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
      - uses: actions/upload-artifact@v4
        with: { name: FLOPPY-Windows-unsigned, path: dist/FLOPPY-Setup-*.exe }

name: build
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install -r requirements.txt
      - run: ./build-mac.sh && ./build-dmg.sh
      - uses: actions/upload-artifact@v4
        with: { name: FLOPPY-macOS-unsigned, path: dist/*.dmg }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - run: powershell -File build-win.ps1
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q floppy.iss'
      - uses: actions/upload-artifact@v4
        with: { name: FLOPPY-Windows-unsigned, path: dist/FLOPPY-Setup-*.exe }

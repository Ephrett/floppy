let LANG='fr';function t(k,...a){const v=T[LANG][k]??T.fr[k];return typeof v==='function'?v(...a):v}
function setLang(l){LANG=l;post('/api/options',{lang:l}).then(refresh)}

const LOC=()=>LANG==='en'?'en-GB':'fr-FR';const fmtT=t=>t?new Date(t*1000).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'}):'—';const fmtD=t=>t?new Date(t*1000).toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric'}):'';
const nf=n=>(n??0).toLocaleString(LOC());const STEPS=['machine','engine','model','identity','ready'];
let S=null,ST=null,LOGS=[],view='wizard',timer=null,U={overlay:false,revealed:false,importOpen:false,modelPick:false};
// ---- mascotte Floppy : grille 7×7, humeurs repos/travail/nuit/attention/reussite/erreur
function mascot(mood='repos',size=72,mono=false,bg='#0E1526'){const blue=mono?'#F4F6FA':'#4FB0E0',white='#F4F6FA',green='#58C28C',amber='#E0B24F',red='#E5706A',dark=bg;const tile=size/7,gap=size<40?0:tile*.14,radius=(size<40?tile*.3:tile*.24);const shape=[[2,4],[1,5],[0,6],[0,6],[0,6],[1,5],[2,4]];const T=[];for(let r=0;r<7;r++)for(let c=0;c<7;c++){const on=c>=shape[r][0]&&c<=shape[r][1];T.push({bg:on?blue:'transparent',o:1,al:'stretch',h:'100%',an:'none'})}
const at=(r,c)=>T[r*7+c],set=(r,c,o)=>Object.assign(at(r,c),o);const eye=(r,c)=>set(r,c,{bg:mono?dark:white,an:mood==='repos'?'floppyBlink 5s ease-in-out infinite':'none'});const closed=(r,c)=>set(r,c,{bg:mono?dark:white,al:'center',h:'34%'});const mc=mono?dark:white;
if(mood==='nuit'){closed(2,2);closed(2,4)}else{eye(2,2);eye(2,4)}
if(mood==='erreur'){set(5,2,{bg:mc});set(4,3,{bg:mc});set(5,4,{bg:mc})}else if(mood==='attention'){set(4,2,{bg:mc});set(4,3,{bg:mc});set(4,4,{bg:mc})}else if(mood==='nuit'){set(4,3,{bg:mc,al:'center',h:'34%'})}else{set(4,2,{bg:mc});set(5,3,{bg:mc});set(4,4,{bg:mc})}
if(mood==='attention')set(1,4,{bg:mono?dark:amber});if(mood==='erreur'){set(1,2,{bg:mono?dark:red});set(1,4,{bg:mono?dark:red});[2,3,4].forEach(c=>set(6,c,{bg:mono?white:red}))}
if(mood==='reussite')[2,3,4].forEach(c=>set(6,c,{bg:mono?white:green}));if(mood==='travail')[2,3,4].forEach((c,i)=>set(6,c,{bg:white,an:'floppyScroll 1.2s linear infinite '+(i*.4)+'s'}));if(mood==='nuit')T.forEach(t=>{if(t.bg===blue)t.o=.7});
const notch=size>=40&&mood!=='nuit';return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><div style="display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:${gap}px;width:100%;height:100%">${T.map(t=>`<div style="background:${t.bg};border-radius:${radius}px;opacity:${t.o};align-self:${t.al};height:${t.h};animation:${t.an}"></div>`).join('')}</div>${notch?`<div style="position:absolute;left:${size*.06}px;top:${size*.79}px;width:${size*.3}px;height:${Math.max(1.5,size*.035)}px;background:${dark};transform:rotate(-45deg);border-radius:999px"></div>`:''}${mood==='nuit'?`<div style="position:absolute;right:${-size*.1}px;top:${-size*.08}px;width:${size*.26}px;height:${size*.26}px;border-radius:50%;box-shadow:inset ${-size*.07}px ${size*.05}px 0 0 ${mono?white:amber}"></div>`:''}</div>`}
const tiles=(n,total,cls='on',extra='')=>Array.from({length:total},(_,i)=>`<i class="${i<n?cls:''}${extra&&i===n?' '+extra:''}"></i>`).join('');
const oct=(letter,sel,big)=>`<div class="badge oct ${sel?'sel':''}"><b class="oct hj">${letter}</b></div>`;
function stepIndex(){return STEPS.indexOf(S.step)}
function cadenceBase(){const m=S.model||{},p=S.probe||{};return Math.min(600,Math.max(60,m.jobs_per_hour_measured?Math.round(m.jobs_per_hour_measured*.6):(p.jobs_per_hour_start||150)))}
function cadenceMode(){const c=Number((S.options||{}).cadence||0),b=cadenceBase();if(!c)return 1;const r=c/b;return r<.62?0:r<.87?1:2}
// ---- rendu
async function refresh(){try{S=await(await fetch('/api/state')).json()}catch(e){renderOffline();return}LANG=(S.options||{}).lang||((navigator.language||'fr').toLowerCase().startsWith('en')?'en':'fr');if(S.step==='ready'&&view==='wizard')view='dash';render();}
function render(){const task=S.task||{},running=task.status==='running';const cur=stepIndex();
  let head,body;
  if(view==='settings'){head=hdr(t('settings'),'');body=settings()}
  else if(view==='dash'){const st=ST||{};const mode=!st.running?(st.today===0&&st.total24===0?'vide':'pause'):'actif';head=hdr('',pill(mode));body=dash(mode)}
  else{head=hdr(t('wizard'),'');body=wizard(cur,task,running)}
  const keep={};document.querySelectorAll('input.keep').forEach(i=>{if(i.value)keep[i.id]=i.value});const focus=document.activeElement&&document.activeElement.id;
  $('#app').innerHTML=head+body+(U.overlay?backupOverlay():'');

  const journal=(LOGS||[]).slice(-9).reverse().map(x=>{const mm=x.match(/^\[(\d{4}-\d\d-\d\dT)?(\d\d:\d\d:\d\d)Z?\]\s*(.*)$/);const tm=mm?localHMS(x):'';const msg=mm?mm[3]:x;const c=/échou|erreur|Traceback/i.test(msg)?'var(--err)':/VALIDATE-local useful/.test(msg)?'var(--ok)':/RESULT/.test(msg)?'var(--t2)':'var(--t3)';return `<div class="ln" style="color:${c}"><span>${tm}</span><span>${esc(msg.replace(/^RESULT (k\w+) seq=\d+ \((\d+) caract\S*res, moteur (\S+)\)/,(a,b,n,e)=>t('delivered',b,n,e)).replace(/^CLAIM (k\w+) job_seq=\d+ claim_seq=\S+ \[\w+\] \| /,(a,b)=>t('taken',b)))}</span></div>`}).join('');
  const cols=t('cols');const dl=(st.last||[]).slice(0,8).map(d=>`<div class="tbl"><span class="m">${fmtT(d.ts)}</span><span class="m">${esc(d.job)}</span><span class="t">${esc(d.title||'—')}</span><span class="m">${esc(d.engine)}</span><span class="st ok"><i></i>${t('deliveredSt')}</span></div>`).join('');
  const banner=paused?`<div class="banner w"><i></i><span>${t('bPause')}</span><span class="m">${t('bPauseMeta')}</span></div>`:empty?`<div class="banner a"><i></i><span>${t('bEmpty')}</span><span class="m">${t('startedAt',fmtT(st.since))}</span></div>`:!id.backup_confirmed?`<div class="banner w"><i></i><span>${t('bKey')}</span><button class="btn sm" onclick="U.overlay=true;render()">${t('saveNow')}</button></div>`:'';
  const ax=t('axis');const axis=`<div class="axis">${ax.map(a=>`<span>${a}</span>`).join('')}</div>`;
  return `<div class="dash">${banner}<div class="dg"><div class="col"><div class="card playcard"><div class="playbtn oct ${live?'':'off'}" onclick="${live?'pause()':'play()'}">${live?'<div class="pp"><i></i><i></i></div>':'<div class="tri"></div>'}</div><div><div style="font-size:16px;font-weight:600;line-height:1.3">${live?t('workingSince',fmtT(st.since)):paused?t('paused'):t('ready')}</div><div class="t3" style="font-size:12.5px;margin-top:4px">${esc(cadLabel())}</div></div><div style="display:flex;align-items:center;gap:14px;width:100%;padding-top:12px;border-top:1px solid var(--s2)">${mascot(live?'travail':'repos',48,false,'#131C30')}<div class="t2" style="flex:1;text-align:left;font-size:13px;line-height:1.4">${live?t('mLive'):paused?t('mPause'):t('mReady')}</div></div><div style="display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;padding-top:10px;border-top:1px solid var(--s2)" onclick="autostart(true)"><div class="tog on"><i></i></div><span style="font-size:13.5px;font-weight:500">${t('autostart')}</span></div></div>
  <div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">${t('health')}</span><span class="t3" style="font-size:11.5px">${t('snap')}</span></div>${health}</div>
  <div class="jr" style="flex:1"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">${t('journal')}</span><span class="t3" style="font-size:11.5px">${t('journalLast')}</span></div><div style="display:flex;flex-direction:column;min-height:0;overflow:hidden">${journal||`<div class="ln t3"><span></span><span>${t('waitingLog')}</span></div>`}</div></div></div>
  <div class="col"><div class="kpis">${kpis}</div><div class="g2" style="gap:12px"><div class="card" style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:13px">${t('perHour')}</b><span class="t3" style="font-size:11.5px">${t('total24',nf(st.total24))}</span></div><div class="bars">${hourly}</div>${axis}</div>
  <div class="card" style="padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:13px">${t('usefulVsNot')}</b><span class="t3" style="font-size:11.5px;display:flex;gap:12px"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--acc);margin-right:5px"></i>${t('usefulL')}</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--warn);margin-right:5px"></i>${t('notL')}</span></span></div><div class="bars">${fb}</div>${axis}</div></div>
  <div class="card" style="flex:1;min-height:240px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:13px">${t('lastDeliv')}</b><span class="t3" style="font-size:11.5px">${dl?t('last8'):t('waitFirst')}</span></div>${dl?`<div class="tbl h">${cols.map(c=>`<span>${c}</span>`).join('')}</div><div style="overflow:auto">${dl}</div>`:`<div class="empty">${mascot('repos',56,false,'#131C30')}<b style="font-size:15px">${t('noDeliv')}</b><span class="t3" style="font-size:13px;max-width:380px;line-height:1.5">${t('noDelivDesc')}</span></div>`}</div></div></div></div>`}
function tgCard(){const tg=S.telegram||{},task=S.task||{},pairing=task.name==='telegram'&&task.status==='running',last=(task.log||[]).slice(-1)[0]||'';const st=pairing?'pairing':tg.paired?'paired':tg.set?'set':'none';
  const body=st==='none'?`<div class="t2" style="font-size:13px;line-height:1.45;margin-bottom:10px">${t('tgHow')}</div><div style="display:flex;gap:8px"><input id="tgt2" class="in keep" type="password" autocomplete="off" placeholder="123456:ABC-…" style="flex:1"><button class="btn sm p" onclick="saveTg()">${t('tgSaveBtn')}</button></div>`
  :st==='set'?`<div class="t2" style="font-size:13px;line-height:1.5;margin-bottom:10px">${esc(t('tgSteps',tg.bot||''))}</div><div class="row"><span class="t3" style="font-size:12.5px">${task.name==='telegram'&&task.status==='error'?`<span class="err">${esc(last.replace(/^\[\d\d:\d\d:\d\d\]\s*/,''))}</span>`:''}</span><div style="display:flex;gap:8px"><button class="btn sm q" onclick="tgUnpair()">${t('tgUnpair')}</button><button class="btn sm p" onclick="post('/api/telegram-pair').then(refresh)">${t('tgPairBtn')}</button></div></div>`
  :st==='pairing'?`<div class="t2" style="font-size:13px;line-height:1.5"><span class="chip">${t('tgPairing')}</span> <span class="t3">${esc(last.replace(/^\[\d\d:\d\d:\d\d\]\s*/,''))}</span></div>`
  :`<div class="row"><div><div style="font-size:14.5px;font-weight:600" class="ok">✓ ${esc(t('tgPaired',tg.paired))}${tg.bot?` <span class="t3 mono" style="font-weight:400;font-size:12px">@${esc(tg.bot)}</span>`:''}</div><div class="t3" style="font-size:12.5px;margin-top:3px">${t('tgAlerts')}</div></div><div style="display:flex;gap:8px;flex:none"><button class="btn sm q" onclick="tgUnpair()">${t('tgUnpair')}</button><button class="btn sm" onclick="tgTest()">${t('tgTest')}</button></div></div>`;
  return `<div class="card"><div class="lbl">${t('stTg')}</div>${body}</div>`}
async function saveTg(){const i=$('#tgt2');if(!i||!i.value)return;const r=await post('/api/options',{telegram_token:i.value});if(r.error){alert(r.error);return}i.value='';refresh()}
async function tgTest(){const r=await post('/api/telegram-test');alert(r.ok?t('tgTestOk'):t('tgTestFail',r.error||'?'))}
async function tgUnpair(){if(!confirm(t('tgUnpairAsk')))return;await post('/api/telegram-unpair');refresh()}
function settings(){const m=S.model||{},p=S.probe||{},id=S.identity||{};return `<div class="set"><div class="row" style="align-items:flex-end"><div><div class="eyebrow">FLOPPY</div><h1 class="hj">${t('stTitle')}</h1></div><div class="t3" style="font-size:13px;text-align:right;line-height:1.5">${t('stNote')}</div></div>
  <div class="g2" style="gap:16px;align-items:start"><div style="display:flex;flex-direction:column;gap:16px">
  <div class="card"><div class="lbl">${t('stModel')}</div><div class="row"><div><div style="font-size:17px;font-weight:600">${esc(m.name||p.model||'—')}</div><div class="t2" style="font-size:13px;margin-top:4px">${m.tok_s?t('tokMeasured',m.tok_s):''}${t('advised',p.tier||'?',p.model||'')}</div></div>${U.modelPick?`<select id="mdl" class="in" style="width:190px">${['gemma4:26b','gemma4:12b','qwen3.5:4b','qwen3.5:2b'].map(x=>`<option ${x===(m.name||p.model)?'selected':''}>${x}</option>`).join('')}</select><button class="btn sm p" onclick="changeModel()">${t('apply')}</button>`:`<button class="btn sm" onclick="U.modelPick=true;render()">${t('changeModel')}</button>`}</div><div class="t3" style="font-size:12.5px;line-height:1.45">${t('modelHint')}</div></div>
  <div class="card"><div class="lbl">${t('stAuto')}</div><div class="tr" style="cursor:pointer" onclick="autostart(true)"><div class="tog on"><i></i></div><div style="flex:1"><div style="font-size:14.5px;font-weight:500">${t('autoOn')}</div><div class="t3" style="font-size:12.5px;margin-top:2px">${S.os==='Darwin'?t('autoOnMac'):t('autoOnWin')}</div></div></div><div class="tr" style="cursor:pointer" onclick="autostart(false)"><div class="tog"><i></i></div><div style="flex:1"><div style="font-size:14.5px;font-weight:500">${t('autoOff')}</div><div class="t3" style="font-size:12.5px;margin-top:2px">${t('autoOffDesc')}</div></div></div><div class="tr" style="opacity:.55"><div class="tog"><i></i></div><div style="flex:1"><div style="font-size:14.5px;font-weight:500">${t('acOnly')}</div><div class="t3" style="font-size:12.5px;margin-top:2px">${t('soon')}</div></div></div></div>
  <div class="card"><div class="lbl">${t('stLang')}</div><div class="row"><div class="t2" style="font-size:13px;line-height:1.45">${t('langDesc')}</div><div style="display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--bg);border:1px solid var(--line);flex:none"><span onclick="setLang('fr')" style="cursor:pointer;padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:600;${LANG==='fr'?'background:var(--s2)':'color:var(--t3)'}">Français</span><span onclick="setLang('en')" style="cursor:pointer;padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:600;${LANG==='en'?'background:var(--s2)':'color:var(--t3)'}">English</span></div></div></div></div>
  <div style="display:flex;flex-direction:column;gap:16px">${tgCard()}<div class="card"><div class="lbl">${t('stFolder')}</div><div class="row"><div style="min-width:0"><div class="mono" style="font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.home||'')}</div><div class="t2" style="font-size:13px;margin-top:4px">${t('folderDesc')}</div></div><button class="btn sm" onclick="post('/api/open-folder')">${t('open')}</button></div></div>
  <div class="card"><div class="lbl">${t('stReinstall')}</div><div class="row"><div class="t2" style="font-size:13px;line-height:1.45">${t('reinstallDesc')}</div><button class="btn sm d" onclick="resetApp()">${t('reinstallBtn')}</button></div></div>
  <div class="card"><div class="lbl">${t('stKey')}</div><div class="row"><div style="display:flex;align-items:center;gap:12px"><div class="oct" style="width:36px;height:36px;background:var(--acc);display:grid;place-items:center"><div style="width:11px;height:11px;border-radius:3px;background:var(--bg)"></div></div><div><div class="mono" style="font-size:13.5px">${esc(shortDid(id.did))}</div><div style="font-size:12.5px;margin-top:3px;font-weight:600" class="${id.backup_confirmed?'ok':'warn'}">${id.backup_confirmed?t('backupOn',fmtD(id.backup_at)):t('backupOff')}</div></div></div><button class="btn sm" onclick="U.overlay=true;render()">${id.backup_confirmed?t('dlAgain'):t('saveNow')}</button></div></div></div></div></div>`}
function renderOffline(){$('#app').innerHTML=`<header><div style="display:flex;align-items:baseline;gap:10px"><span class="hj wm">FLOPPY</span></div><div class="mid">${pill('horsligne')}</div><div></div></header><div class="load">${mascot('attention',112)}<div><div class="hj" style="font-size:44px;line-height:1.05">${t('offTitle')}</div><div class="t2" style="font-size:15.5px;margin-top:10px">${t('offDesc')}</div></div></div>`;clearTimeout(timer);timer=setTimeout(refresh,5000)}
function localHMS(line){const m=line.match(/^\[(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)Z\]/);if(!m)return '';return new Date(m[1]+'Z').toLocaleTimeString(LOC())}
function cadLabel(){const o=S.options||{};return t('cadLabel',t('cadNames')[cadenceMode()],nf(o.cadence||cadenceBase()))}
// ---- actions
async function goStep(i){if(i<=stepIndex()||S.step==='ready'){await post('/api/reset-step',{step:STEPS[i]});view='wizard';refresh()}}
async function next(step){await post('/api/reset-step',{step});if(step==='ready'){view='dash'}refresh()}
async function scan(){const n=$('#mname');if(n)await post('/api/options',{machine_name:n.value});await post('/api/scan');refresh()}
async function run(u){await post(u);refresh()}
async function saveOpts(){const xh=$('#xh'),tgt=$('#tgt');const b={};if(xh)b.x_handle=xh.value;if(tgt&&tgt.value)b.telegram_token=tgt.value;const r=await post('/api/options',b);if(r.error)alert(r.error);if(tgt)tgt.value='';return r}
async function identity(){await saveOpts();const seed=$('#seed');const v=seed?seed.value.trim():'';if(seed)seed.value='';await post('/api/identity',v?{mode:'import',seed_hex:v}:{mode:'new'});U.overlay=false;const wait=setInterval(async()=>{await refresh();if(S.identity&&S.identity.did&&(S.task||{}).status!=='running'){clearInterval(wait);if(!S.identity.backup_confirmed){U.overlay=true;render()}}},1500)}
async function pickCadence(i){const v=Math.round(cadenceBase()*[.5,.75,1][i]);await post('/api/options',{cadence:String(v)});refresh()}
async function play(){await post('/api/play');view='dash';refresh()}async function pause(){await post('/api/pause');refresh()}
async function autostart(e){const r=await post('/api/autostart',{enable:e});alert(t('autostartRes',r.result))}
async function changeModel(){await post('/api/model',{name:$('#mdl').value});await post('/api/reset-step',{step:'model'});U.modelPick=false;view='wizard';refresh()}
async function resetApp(){if(!confirm(t('reinstallConfirm')))return;await post('/api/reset');view='wizard';refresh()}
async function revealSeed(){if(U.revealed){U.revealed=false;render();return}const r=await(await fetch('/api/seed-backup')).json();if(!r.seed_hex){alert(r.error||t('keyUnavailable'));return}U.revealed=true;render();const k=$('#keytext');if(k)k.textContent=r.seed_hex.replace(/(.{4})/g,'$1 ').trim()}
async function copySeed(){const r=await(await fetch('/api/seed-backup')).json();if(!r.seed_hex)return;try{await navigator.clipboard.writeText(r.seed_hex);alert(t('keyCopied'))}catch(e){alert(t('copyFail'))}}
async function downloadSeed(){const r=await(await fetch('/api/seed-backup')).json();if(!r.seed_hex)return;const txt=t('rescueFile',r.did,r.seed_hex);const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);a.download='floppy-identite-SECRET.txt';document.body.appendChild(a);a.click();a.remove()}
async function backupDone(){if((S.identity||{}).backup_confirmed)return;await post('/api/backup-done');await refresh()}
function copyLog(){const l=(S.task||{}).log||[];navigator.clipboard.writeText(l.join('\n')).then(()=>alert(t('logCopied'))).catch(()=>{})}
function shareX(){const s=ST||{},sc=s.score||{};window.open('https://x.com/intent/post?text='+encodeURIComponent(t('shareText',s,sc)),'_blank')}
async function loadStats(){try{ST=await(await fetch('/api/stats')).json();LOGS=(await(await fetch('/api/logs')).json()).lines||[];if(view==='dash'){const md=!ST.running?(ST.today===0&&ST.total24===0?'vide':'pause'):'actif';$('#app').innerHTML=hdr('',pill(md))+dash(md)+(U.overlay?backupOverlay():'')}}catch(e){}}
refresh();
